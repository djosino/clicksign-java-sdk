# Release: push em release/<version> → validate → test → lint → publish → tag
#
# Secrets necessários (Settings → Secrets → Actions):
#   CENTRAL_USERNAME  — token username do Sonatype Central Portal (central.sonatype.com → Account → Access Tokens)
#   CENTRAL_PASSWORD  — token password do Sonatype Central Portal
#   SIGNING_KEY       — chave GPG armored: gpg --armor --export-secret-keys <KEY_ID>
#   SIGNING_PASSWORD  — passphrase da chave GPG

name: Release

on:
  push:
    branches:
      - 'release/*'

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Branch release/<version> deve coincidir com REVISION
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          version="${branch#release/}"
          version="${version#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Branch inválida: use release/X.Y.Z (recebido: $branch)"
            exit 1
          fi
          revision=$(tr -d '[:space:]' < REVISION)
          if [ "$version" != "$revision" ]; then
            echo "Versão da branch ($version) != REVISION ($revision)"
            exit 1
          fi
          echo "Versão validada: $version"

  test:
    name: Java ${{ matrix.java }}
    needs: validate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        java: ['11', '17', '21', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and test
        run: ./gradlew check

  lint:
    name: Checkstyle
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

  publish:
    name: Publish to Maven Central
    needs: [test, lint]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read version from REVISION
        id: version
        run: echo "version=$(tr -d '[:space:]' < REVISION)" >> "$GITHUB_OUTPUT"

      - name: Publish to local staging directory
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishMavenPublicationToLocalBundleRepository

      - name: Create bundle ZIP
        run: |
          cd build/staging-deploy
          zip -r ../../bundle.zip .

      - name: Upload bundle to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          response=$(curl --silent --show-error --fail \
            -u "$CENTRAL_USERNAME:$CENTRAL_PASSWORD" \
            -F "bundle=@bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC")
          echo "Upload response: $response"

      - name: Tag release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
